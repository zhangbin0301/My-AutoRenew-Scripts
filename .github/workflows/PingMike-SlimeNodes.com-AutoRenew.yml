name: 🟢 PingMike-SlimeNodes.com-AutoRenew

on:
  schedule:
    # 每两天运行一次（UTC 18:00）
    - cron: '0 18 */2 * *'

  workflow_dispatch:

jobs:
  renew:
    name: 🔄 执行续期
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # =========================
      # 📥 拉取私库代码
      # =========================
      - name: 📥 拉取私库代码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PingMike-SlimeNodes.com-AutoRenew
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      # =========================
      # 🟢 安装 Node.js
      # =========================
      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # =========================
      # 📦 安装依赖
      # =========================
      - name: 📦 安装依赖
        run: npm install

      # =========================
      # 🌐 安装 Playwright
      # =========================
      - name: 🌐 安装 Playwright
        run: npx playwright install chromium --with-deps

      # =========================
      # 🛡️ 启动代理服务 (GOST / Hysteria 2)
      # =========================
      - name: 🛡️ 启动代理服务 (GOST / Hysteria 2)
        if: ${{ env.SLIME_GOST_PROXY != '' }}
        env:
          SLIME_GOST_PROXY: ${{ secrets.SLIME_GOST_PROXY }}
        run: |
          PROXY_URL="${{ secrets.SLIME_GOST_PROXY }}"
          if [[ "$PROXY_URL" == socks://* ]]; then
            PROXY_URL="socks5://${PROXY_URL#socks://}"
          fi
          if [[ "$PROXY_URL" == hy2://* ]]; then
            echo "⚡ 检测到 Hysteria 2 代理，正在配置 Hysteria 2 客户端..."
            
            # 下载 Hysteria 2 客户端
            HY_VERSION="v2.6.0"
            echo "📦 下载 Hysteria 2 $HY_VERSION..."
            wget -q "https://github.com/apernet/hysteria/releases/download/app%2F${HY_VERSION}/hysteria-linux-amd64" -O hysteria
            chmod +x hysteria
            
            # 使用 Node.js 解析并生成 yaml 配置文件
            PROXY_URL="$PROXY_URL" node -e '
            try {
              const url = new URL(process.env.PROXY_URL);
              const password = decodeURIComponent(url.username || url.password || "");
              const server = url.host;
              const insecure = url.searchParams.get("insecure") === "1" || url.searchParams.get("insecure") === "true";
              const sni = url.searchParams.get("sni") || "";
              
              const yaml = [
                `server: ${server}`,
                `auth: ${password}`,
                `http:`,
                `  listen: 127.0.0.1:8080`,
                `tls:`,
                `  insecure: ${insecure}`
              ];
              if (sni) {
                yaml.push(`  sni: ${sni}`);
              }
              
              const fs = require("fs");
              fs.writeFileSync("hysteria.yaml", yaml.join("\n"));
              console.log("✅ 成功生成 hysteria.yaml");
            } catch (err) {
              console.error("❌ 解析代理链接失败:", err.message);
              process.exit(1);
            }
            '
            
            # 启动 Hysteria 2
            nohup ./hysteria client -c hysteria.yaml > hysteria.log 2>&1 &
            sleep 4
            
          else
            echo "🛡️ 检测到普通代理，正在配置 GOST..."
            VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest \
              | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
            
            echo "📦 GOST VERSION: $VERSION"
            wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
            tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
            chmod +x gost
            nohup ./gost \
              -L http://:8080 \
              -F "$PROXY_URL" \
              > gost.log 2>&1 &
            sleep 3
          fi

          echo "✅ 测试本地代理端口 8080..."
          MASKED_IP=$(curl -s \
            -x http://127.0.0.1:8080 \
            https://api.ipify.org \
            | sed 's/\([0-9]*\.[0-9]*\)\..*/\1.**.**/g')
          echo "🌐 出口 IP: $MASKED_IP"

      # =========================
      # 🚀 执行续期
      # =========================
      - name: 🚀 执行续期
        env:
          SLIME_EMAIL:        ${{ secrets.SLIME_EMAIL }}
          SLIME_PASSWORD:     ${{ secrets.SLIME_PASSWORD }}

          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          SLIME_GOST_PROXY:   http://127.0.0.1:8080

        run: npx playwright test
