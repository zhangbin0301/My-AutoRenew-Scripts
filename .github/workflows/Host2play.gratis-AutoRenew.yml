name: Host2play-AutoRenew

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'  # 每4小时运行一次(UTC)

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Host2play.gratis-AutoRenew
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg
          # 安装 Google Chrome
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage faster-whisper requests

      - name: Pre-check API connectivity
        run: |
          echo "Testing host2play API..."
          curl -sS -o /dev/null -w "HTTP %{http_code} | %{time_total}s" "${API_URL}" || echo "curl failed"
          python3 -c "import requests; r=requests.get('${API_URL}',timeout=15); print(f'HTTP {r.status_code}: {r.text[:300]}')"
        env:
          API_URL: https://host2play.gratis/publicapis/getServerData?i=b56972fd-2efd-4532-ac8b-b1a4e04ce6c4

      - name: Run renew script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run --auto-servernum python3 renew_final.py

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-output
          path: |
            ./*.html
            ./*.png
          retention-days: 3
