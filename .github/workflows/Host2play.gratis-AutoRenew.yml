name: Host2play-AutoRenew

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'  # 每4小时运行一次(UTC)

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Host2play.gratis-AutoRenew
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Setup WARP
        run: |
          # 安装 Cloudflare WARP
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          # 注册并连接（proxy 模式，不接管全局流量）
          yes | warp-cli registration new
          warp-cli mode proxy
          warp-cli connect
          # 等待连接就绪
          for i in $(seq 1 15); do
            if warp-cli status 2>/dev/null | grep -q "Connected"; then
              echo "✅ WARP connected"
              break
            fi
            echo "⏳ Waiting for WARP... ($i/15)"
            sleep 2
          done
          # 验证：通过 WARP 代理访问（socks5://127.0.0.1:40000）
          curl -x socks5h://127.0.0.1:40000 -sS https://cloudflare.com/cdn-cgi/trace | head -5
          echo "WARP setup done"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get install -y xvfb ffmpeg
          # 安装 Google Chrome
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage faster-whisper requests pysocks

      - name: Run renew script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALL_PROXY: socks5h://127.0.0.1:40000
        run: xvfb-run --auto-servernum python3 renew_final.py

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-output
          path: |
            ./*.html
            ./*.png
          retention-days: 3
